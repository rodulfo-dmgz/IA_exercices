<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="darkreader-lock">   <!-- le cours a son propre thème sombre : pas de recoloration par extension -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon bilan</title>
  <link rel="stylesheet" href="/src/css/main.css">
  <script>try{var d=document.documentElement,s=localStorage.getItem('rd_theme');if(s==='dark'||(s!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))d.classList.add('dark');if(localStorage.getItem('rd_contrast')==='1')d.classList.add('high-contrast')}catch(e){}</script>
</head>
<body class="page-stage page-carnet page-bilan">

  <main class="content">
    <header class="page-header" id="page-header">
      <div class="content-header">
        <div class="content-heading">
          <p class="eyebrow">CARNET DE NOTES</p>
          <h1 class="page-title">Mon bilan</h1>
        </div>
      </div>
      <hr class="divider">
    </header>

    <div class="print-only bilan-print-head" id="bilan-print-head"></div>
    <section class="attestation" id="bilan-attestation" hidden aria-label="Attestation de réussite"></section>
    <div class="panel" id="bilan-root"><p class="panel-text">Chargement du bilan…</p></div>
  </main>

  <script type="module" src="/src/js/bilan.js"></script>
  <script type="module" src="/src/js/profile.js"></script>
  <script type="module" src="/src/js/page-header.js"></script>
</body>
</html>
